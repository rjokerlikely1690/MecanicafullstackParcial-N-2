# Configuracion del servidor
server.port=8080
spring.application.name=taller-mecanico-backend
spring.main.allow-circular-references=true

# MongoDB
# Se recomienda definir MONGODB_URI como variable de entorno.
# Si no existe, se usa una base local por defecto.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tallermecanico}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
# Definir JWT_SECRET como variable de entorno en despliegue.
jwt.secret=${JWT_SECRET:ChangeMeForLocalDevelopmentOnly123456789012}
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
